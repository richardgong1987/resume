# The published CV prints a years-of-experience figure derived from the build
# date. GitHub Pages only rebuilds when something is pushed, so without a nudge
# that figure would freeze at whatever it was when the CV was last edited.
#
# Scheduled workflows only run on the default branch, which is why this lives on
# master while the site itself is built from gh-pages.
name: Refresh published site

on:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st of each month
  workflow_dispatch:        # and on demand, to verify it works

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
