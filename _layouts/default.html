<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">

  {% include head-custom.html %}
</head>

  <a class="skip-link" href="#main-content">Skip to content</a>

      <a href="{{ '/' | relative_url }}" {% if page.page_kind == 'home' %}aria-current="page"{% endif %}>Overview</a>

  <main id="main-content" class="{% if page.page_kind == 'home' %}home{% else %}document{% endif %}">
